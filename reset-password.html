<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Reset Password — Tasara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card glass" style="max-width:480px;">
      <div class="auth-logo">
        <h1>Tasara</h1>
        <p>Choose a new password</p>
      </div>
      <div class="auth-header">
        <h2>Reset Password</h2>
        <p>Enter a new password for your account.</p>
      </div>
      <div id="reset-form-wrap">
        <form id="reset-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reset-password">New Password</label>
            <input type="password" id="reset-password" class="form-input" placeholder="Min. 6 characters" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reset-confirm">Confirm New Password</label>
            <input type="password" id="reset-confirm" class="form-input" placeholder="Re-enter new password" required>
          </div>
          <div id="reset-error" class="form-error hidden"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-btn">
            Update Password
          </button>
        </form>
      </div>
      <div id="reset-invalid" class="hidden">
        <div class="card" style="text-align:center;padding:32px;">
          <div style="font-size:2.5rem;margin-bottom:12px;">⚠</div>
          <h2 style="margin-bottom:8px;">Link Expired</h2>
          <p style="color:var(--clr-text-mid);margin-bottom:24px;">This password reset link is invalid or has expired. Request a new one from the login page.</p>
          <a href="login.html" class="btn btn-primary">Back to Login</a>
        </div>
      </div>
      <div class="auth-footer mt-md">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { getSupabase } from './js/supabase.js';
    import { toast, setLoading } from './js/ui.js';

    const supabase = getSupabase();
    const formWrap = document.getElementById('reset-form-wrap');
    const invalidWrap = document.getElementById('reset-invalid');

    // The recovery link lands here with a PKCE code in the URL.
    // detectSessionInUrl exchanges it automatically; wait for the
    // resulting session before showing the form.
    let haveSession = false;
    for (let i = 0; i < 10 && !haveSession; i++) {
      const { data } = await supabase.auth.getSession();
      haveSession = !!data.session;
      if (!haveSession) await new Promise(r => setTimeout(r, 300));
    }

    if (!haveSession) {
      formWrap.classList.add('hidden');
      invalidWrap.classList.remove('hidden');
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPw = document.getElementById('reset-password').value;
      const confirm = document.getElementById('reset-confirm').value;
      const errEl = document.getElementById('reset-error');
      const btn = document.getElementById('reset-btn');

      errEl.classList.add('hidden');
      if (!newPw || !confirm) {
        errEl.textContent = 'Please fill in all fields.';
        errEl.classList.remove('hidden');
        return;
      }
      if (newPw !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.remove('hidden');
        return;
      }
      if (newPw.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.classList.remove('hidden');
        return;
      }

      setLoading(btn, true);
      try {
        const { error } = await supabase.auth.updateUser({ password: newPw });
        if (error) throw error;
        toast('Password updated! You can now log in.', 'success');
        // End the recovery session so the user signs in fresh.
        await supabase.auth.signOut();
        setTimeout(() => { window.location.href = '/login.html'; }, 1500);
      } catch (err) {
        errEl.textContent = err.message || 'Failed to update password.';
        errEl.classList.remove('hidden');
      } finally {
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
